name: Deploy web apps

# Three sites live on Vercel:
#   website               - the public marketing site
#   garage-boss-dashboard - the owner's read-only admin web view
#   reception             - the installable check-in PWA
#
# A push to main deploys to production; a pull request gets a preview URL.
# Only the apps whose files actually changed are redeployed.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'reception/**'
      - 'garage-boss-dashboard/**'
      - '.github/workflows/deploy-web.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'reception/**'
      - 'garage-boss-dashboard/**'
  workflow_dispatch:

# On a pull_request event dorny/paths-filter asks the API which files changed,
# which needs pull-requests: read. Without this block the job runs with the
# repository's restrictive default token and the call fails with "Resource not
# accessible by integration" - invisibly, until the first PR is opened, because
# a push event diffs with git and never touches the API.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set.outputs.apps }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            website:
              - 'website/**'
            reception:
              - 'reception/**'
            garage-boss-dashboard:
              - 'garage-boss-dashboard/**'

      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'apps=["website","reception","garage-boss-dashboard"]' >> "$GITHUB_OUTPUT"
          else
            echo 'apps=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.apps != '[]' && needs.changes.outputs.apps != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Resolve the Vercel project for this app
        id: project
        # Each site is its own Vercel project, so each needs its own id. A
        # missing id is reported and skipped rather than failing the run,
        # so wiring the sites up one at a time still leaves a green build.
        run: |
          case "${{ matrix.app }}" in
            website)               ID="${{ secrets.VERCEL_PROJECT_ID_WEBSITE }}" ;;
            reception)             ID="${{ secrets.VERCEL_PROJECT_ID_RECEPTION }}" ;;
            garage-boss-dashboard) ID="${{ secrets.VERCEL_PROJECT_ID_BOSS }}" ;;
          esac
          if [ -z "$ID" ] || [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::Skipping ${{ matrix.app }} - set VERCEL_TOKEN, VERCEL_ORG_ID and the project id secret to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::add-mask::$ID"
            echo "id=$ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        id: deploy
        if: steps.project.outputs.ready == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.id }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APP: ${{ matrix.app }}
        # Build here rather than on Vercel so a broken build fails this run
        # and never becomes a live deployment. VITE_* values come from the
        # Vercel project's own environment variables, pulled below.
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then TARGET=production; else TARGET=preview; fi
          npx --yes vercel@latest pull --yes --environment="$TARGET" --token="$TOKEN" --cwd "$APP"
          if [ "$TARGET" = "production" ]; then
            npx --yes vercel@latest build --prod --token="$TOKEN" --cwd "$APP"
            URL=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$TOKEN" --cwd "$APP")
          else
            npx --yes vercel@latest build --token="$TOKEN" --cwd "$APP"
            URL=$(npx --yes vercel@latest deploy --prebuilt --token="$TOKEN" --cwd "$APP")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### ${APP} deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the deployment
        # Only production: preview URLs sit behind Vercel's deployment
        # protection, where an unauthenticated fetch gets a 401 and would
        # fail this step for a perfectly good deploy.
        if: steps.deploy.outputs.url != '' && github.ref == 'refs/heads/main'
        # A 200 with an empty body is still a broken site, so check that the
        # page really carries the app's mount point.
        run: |
          curl -sSfL --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}" -o page.html
          grep -q 'id="root"' page.html
          echo "OK: ${{ steps.deploy.outputs.url }}"
