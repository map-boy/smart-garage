name: CI

# Every push and every pull request builds all five surfaces. A commit that
# breaks one of them should be visible here, not discovered on release day.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    timeout-minutes: 15
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [website, reception, garage]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.app }}
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: Build
        working-directory: ${{ matrix.app }}
        # The apps that read Firebase from import.meta.env still have to build
        # without it: the bundle is public, so real keys belong in the hosting
        # provider's environment, never in this workflow.
        run: npm run build

      - name: Report bundle size
        working-directory: ${{ matrix.app }}
        run: |
          echo "### ${{ matrix.app }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          find dist -name '*.js' -o -name '*.css' | xargs ls -lh | awk '{print $5, $9}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  android:
    timeout-minutes: 30
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [reception-android, stock-android]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        working-directory: ${{ matrix.app }}
        # assembleRelease, not assembleDebug, because the release build is what
        # actually ships. Debug skips lintVitalRelease and R8 entirely, so a
        # fatal lint error could reach a real release without CI ever seeing it
        # - which is exactly how the first release of this repo failed.
        #
        # No Firebase values or keystore needed: the BuildConfig strings default
        # to empty and release signing falls back to the debug key, so a missing
        # secret cannot break CI.
        run: ./gradlew --no-daemon --stacktrace assembleRelease

  desk:
    timeout-minutes: 30
    name: build garage-desk
    runs-on: ubuntu-latest
    # The reception/stock app was only ever compiled by the release workflow,
    # so a commit that broke it stayed broken on main until someone cut a
    # release - which is exactly what happened once already. This checks both
    # halves on every push, on Linux, without building a Windows installer:
    # the installer is a packaging step, the compile is what regresses.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: garage-desk/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: garage-desk/src-tauri

      # Tauri's Linux build needs GTK and WebKit headers even for `cargo
      # check`, because the crate graph pulls them in through tauri's build
      # script rather than only at link time.
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install
        working-directory: garage-desk
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: garage-desk
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: garage-desk
        # Vite needs the env file to exist; real values only matter at runtime.
        run: |
          : > .env
          npm run build

      - name: Check Rust
        working-directory: garage-desk/src-tauri
        run: cargo check --locked --all-targets

  electron:
    timeout-minutes: 30
    name: package desktop installer
    # Windows minutes bill at 2x on a private repo, so the full installer is
    # only packaged where it matters: main, and on demand. Tags go through
    # release-desktop.yml instead.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build renderer
        working-directory: garage
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Package installer
        working-directory: garage/desktop
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --win --publish=never

  desk:
    timeout-minutes: 45
    name: package reception & stock installer
    # Same reasoning as the electron job: Windows minutes bill at 2x, so the
    # full Rust build only runs where it matters.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: garage-desk/src-tauri

      - name: Install
        working-directory: garage-desk
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: garage-desk
        run: npx tsc --noEmit

      - name: Build installer
        working-directory: garage-desk
        # No VITE_ values needed to compile: the bundle is public, so real keys
        # belong in the machine that installs it, never in this workflow.
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: garage-desk
          if-no-files-found: error
          path: garage-desk/src-tauri/target/release/bundle/nsis/*.exe